# Configuração do orquestrador. Sobrescreva com --config <arquivo> ou AI_ORCH_CONFIG.

# Worktrees, relatórios e checkpoints ficam aqui. Fora do OneDrive de propósito:
# sincronizar worktrees e o SQLite de checkpoints gera conflitos e lentidão.
workspaces_root: ${LOCALAPPDATA}/ai-orchestrator/workspaces

# Commit local (nunca push) no branch da tarefa quando ela termina como "done".
commit_on_success: true

budgets:
  max_attempts: 3              # ciclos implementação -> validação -> revisão
  max_cost_usd: 10.0           # soma de todas as chamadas de agentes da tarefa
  agent_timeout_seconds: 1800  # por chamada de agente
  validation_timeout_seconds: 900  # por comando de validação

# Detecção de stack pela raiz do repositório (o primeiro preset que casar vence).
# setup roda uma vez no workspace recém-criado, antes de qualquer chamada de agente:
# o workspace é uma cópia limpa do último commit, sem vendor/, node_modules/ nem .env.
# Falha no setup bloqueia a tarefa sem gastar com agentes.
# checks são usados quando nem --check nem o planner definem comandos de validação.
stack_presets:
  # Laravel + Vite: testes que renderizam Blade com @vite precisam de public/build/manifest.json.
  laravel-vite:
    detect: [artisan, composer.json, package-lock.json, vite.config.js]
    setup:
      - composer install --no-interaction --no-progress --quiet
      - php -r "file_exists('.env') || copy('.env.example', '.env');"
      - php artisan key:generate --quiet
      - php -r "is_dir('vendor/laravel/passport') && passthru('php artisan passport:keys --force --no-interaction --quiet');"
      - npm ci --no-audit --no-fund --loglevel=error
      - npm run build
    checks:
      - php artisan test
  laravel:
    detect: [artisan, composer.json]
    setup:
      - composer install --no-interaction --no-progress --quiet
      - php -r "file_exists('.env') || copy('.env.example', '.env');"
      - php artisan key:generate --quiet
      - php -r "is_dir('vendor/laravel/passport') && passthru('php artisan passport:keys --force --no-interaction --quiet');"
    checks:
      - php artisan test
  flutter:
    detect: [pubspec.yaml]
    setup:
      - flutter pub get
    checks:
      - flutter test
  python:
    detect: [pyproject.toml]
    setup:
      - uv sync
    checks:
      - uv run pytest

# Um modelo por papel. provider: claude_code (CLI local, usa sua assinatura)
# | anthropic_api | openai_api (stubs até a Fase 2/4).
roles:
  planner:
    provider: claude_code
    model: opus
    effort: high
    tool_profile: read_only
    prompt: planner.md
    max_budget_usd: 2.0
  implementer:
    provider: claude_code
    model: sonnet
    effort: medium
    tool_profile: implement
    prompt: implementer.md
    max_budget_usd: 4.0
    # Roteamento: a partir desta tentativa, troca para um modelo mais forte.
    escalate_after_attempt: 2
    escalation_model: opus
  reviewer:
    provider: claude_code
    model: opus
    effort: high
    tool_profile: review
    prompt: reviewer.md
    max_budget_usd: 2.0
  # Especialistas: só rodam quando o planner (campo specialists do plano) ou `--with` pedem.
  # Consultores somente leitura entre o plano e a implementação; o que eles exigem vira critério de aceite.
  design:
    provider: claude_code
    model: sonnet
    effort: high
    tool_profile: read_only
    prompt: design.md
    max_budget_usd: 1.5
  devops:
    provider: claude_code
    model: sonnet
    effort: medium
    tool_profile: read_only
    prompt: devops.md
    max_budget_usd: 1.5
